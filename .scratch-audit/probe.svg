<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="420" height="420" viewBox="0 0 420 420">
<style>
*,*::before,*::after{box-sizing:border-box}
.root{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;padding:8px}
h3{font:600 12px system-ui;margin:10px 0 2px}
.viewport{width:343px;outline:2px dashed #999}
.ah-input{width:100%;border-radius:.5rem;border:1px solid #c5c6ca;background:#fff;padding:.5rem .75rem;font-size:.875rem;color:#1a1a1e;outline:none}
form{margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.5rem;border-radius:.75rem;border:1px solid #e2e2e4;background:#f6f6f7;padding:.75rem}
.flex-1{flex:1 1 0%}
.zeromin .flex-1{min-width:0}
button{border-radius:.5rem;background:#d2303b;padding:.5rem 1rem;font-size:.875rem;font-weight:600;color:#fff;border:0}
</style>
<foreignObject x="0" y="0" width="420" height="420">
<div xmlns="http://www.w3.org/1999/xhtml" class="root">
<h3>A. AS SHIPPED (343px content width = 375px phone)</h3>
<div class="viewport">
<form>
  <select class="ah-input flex-1">
    <option value="">Choose a person…</option>
    <option value="1">Bartholomew Fetherstonehaugh — Super Admin</option>
  </select>
  <input class="ah-input flex-1" placeholder="Why (optional)"/>
  <button type="submit">Grant access</button>
</form>
</div>
<h3>B. WITH min-width:0 (what the claim assumes)</h3>
<div class="viewport zeromin">
<form>
  <select class="ah-input flex-1">
    <option value="">Choose a person…</option>
    <option value="1">Bartholomew Fetherstonehaugh — Super Admin</option>
  </select>
  <input class="ah-input flex-1" placeholder="Why (optional)"/>
  <button type="submit">Grant access</button>
</form>
</div>
</div>
</foreignObject>
</svg>
